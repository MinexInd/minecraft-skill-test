<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin — Minecraft Skill Test</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Pixelify+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css">
  <style>
    .admin-wrap { position: relative; z-index: 2; padding: 1.5rem 0 3rem; }
    .admin-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 1rem; margin-bottom: 1.4rem; border-bottom: 3px solid var(--grass); padding-bottom: 0.7rem; flex-wrap: wrap; }
    .admin-head h2 { font-family: var(--font-pixel); font-size: 1rem; text-shadow: 2px 2px 0 var(--line-dark); }
    .admin-head p { font-size: 0.82rem; color: var(--text-dim); margin-top: 0.4rem; }
    .admin-actions { display: flex; gap: 0.6rem; flex-wrap: wrap; }
    .btn-grass { background: var(--grass); color: #0d0f12; border: 2px solid var(--grass-dk); font-family: var(--font-pixel); font-size: 0.6rem; padding: 0.7rem 1rem; cursor: pointer; text-transform: uppercase; box-shadow: inset 2px 2px 0 rgba(255,255,255,.25), inset -2px -2px 0 rgba(0,0,0,.3); transition: transform 0.08s ease; }
    .btn-grass:hover { transform: translateY(-1px); }
    .btn-grass:active { transform: translateY(1px); box-shadow: inset 3px 3px 0 rgba(0,0,0,.3); }
    .btn-danger { background: var(--danger); color: #fff; border: 2px solid #b83a2a; }
    .btn-danger:hover { background: #c94433; }
    .btn-ghost { background: var(--slot-2); color: var(--text); border: 2px solid var(--line-dark); }
    .btn-ghost:hover { background: var(--slot); }

    /* Form */
    .form-card { background: var(--slot); border: 2px solid var(--line-dark); padding: 1.2rem; margin-bottom: 1.4rem; }
    .form-title { font-family: var(--font-pixel); font-size: 0.65rem; color: var(--grass); margin-bottom: 1rem; text-transform: uppercase; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.8rem; }
    .form-full { grid-column: 1 / -1; }
    .field label { display: block; font-size: 0.75rem; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.3px; margin-bottom: 0.3rem; }
    .field input, .field select { width: 100%; background: var(--bg); border: 2px solid var(--line-dark); color: var(--text); font-family: var(--font-body); font-size: 0.95rem; font-weight: 600; padding: 0.6rem 0.7rem; }
    .field input:focus, .field select:focus { border-color: var(--grass); outline: none; }
    .field select { cursor: pointer; }
    .form-actions { display: flex; gap: 0.6rem; margin-top: 1rem; }

    /* Skills row */
    .skills-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 0.6rem; }
    @media (max-width: 700px) { .skills-grid { grid-template-columns: repeat(3, 1fr); } }
    @media (max-width: 420px) { .skills-grid { grid-template-columns: repeat(2, 1fr); } }

    /* Player table */
    .player-table { width: 100%; border-collapse: collapse; margin-bottom: 1.4rem; }
    .player-table th { font-family: var(--font-pixel); font-size: 0.5rem; text-transform: uppercase; color: var(--text-dim); text-align: left; padding: 0.6rem 0.5rem; border-bottom: 2px solid var(--line-dark); white-space: nowrap; }
    .player-table td { padding: 0.5rem; border-bottom: 1px solid var(--line-dark); vertical-align: middle; }
    .player-table tr:hover td { background: var(--slot-2); }
    .player-table .uname { font-weight: 700; white-space: nowrap; }
    .player-table .score-cell { font-family: var(--font-pixel); font-size: 0.6rem; text-align: center; }
    .player-table .actions-cell { white-space: nowrap; }
    .player-table .actions-cell button { font-family: var(--font-pixel); font-size: 0.5rem; padding: 0.35rem 0.5rem; cursor: pointer; border: 2px solid var(--line-dark); background: var(--slot-2); color: var(--text); margin-right: 0.3rem; }
    .player-table .actions-cell button:hover { background: var(--slot); }
    .player-table .actions-cell button.del:hover { background: var(--danger); color: #fff; border-color: #b83a2a; }

    .empty-msg { text-align: center; color: var(--text-dim); font-family: var(--font-pixel); font-size: 0.65rem; padding: 2rem; }
    .toast { position: fixed; bottom: 1.5rem; right: 1.5rem; background: var(--grass); color: #0d0f12; font-family: var(--font-pixel); font-size: 0.6rem; padding: 0.8rem 1.2rem; border: 2px solid var(--grass-dk); z-index: 100; animation: rise 0.3s ease both; }

    /* Drop zone */
    .drop-zone { border: 3px dashed var(--line-dark); background: var(--slot); margin-bottom: 1.4rem; cursor: pointer; transition: border-color 0.2s, background 0.2s; }
    .drop-zone.over { border-color: var(--grass); background: var(--slot-2); }
    .drop-inner { display: flex; flex-direction: column; align-items: center; gap: 0.5rem; padding: 2rem 1rem; text-align: center; }
    .drop-icon { width: 36px; height: 36px; background: var(--text-dim); clip-path: polygon(10% 0, 90% 0, 100% 10%, 100% 90%, 90% 100%, 10% 100%, 0 90%, 0 10%); opacity: 0.5; }
    .drop-text { font-size: 0.9rem; color: var(--text); margin: 0; }
    .drop-sub { font-size: 0.75rem; color: var(--text-dim); margin: 0; }

    /* Skin preview in table */
    .skin-thumb { width: 28px; height: 28px; image-rendering: pixelated; border: 1px solid var(--line-dark); vertical-align: middle; margin-right: 0.3rem; background: var(--slot-2); }
  </style>
</head>
<body>
  <canvas id="bg-canvas" aria-hidden="true"></canvas>

  <header class="site-header">
    <div class="container header-inner">
      <div class="brand">
        <span class="brand-block" aria-hidden="true"></span>
        <div class="brand-text">
          <h1>SKILL TEST</h1>
          <p class="brand-sub">Admin Panel</p>
        </div>
      </div>
      <div style="display:flex;gap:0.5rem;">
        <a href="./index.html" class="pixel-btn">VIEW BOARD</a>
        <button id="theme-btn" class="pixel-btn theme-toggle" type="button">
          <span class="theme-icon" aria-hidden="true"></span>
          <span class="theme-label">PLAINS</span>
        </button>
      </div>
    </div>
  </header>

  <main class="container admin-wrap">
    <section class="admin-head">
      <div>
        <h2>Player Manager</h2>
        <p>Add, edit, or remove players. Download the updated data.json when done.</p>
      </div>
      <div class="admin-actions">
        <button id="btn-download" class="btn-grass" type="button">DOWNLOAD DATA.JSON</button>
        <button id="btn-reset" class="btn-ghost" type="button">RELOAD FROM FILE</button>
      </div>
    </section>

    <!-- Drop zone -->
    <div id="drop-zone" class="drop-zone">
      <div class="drop-inner">
        <span class="drop-icon" aria-hidden="true"></span>
        <p class="drop-text">Drag & drop <strong>data.json</strong> here to load players</p>
        <p class="drop-sub">or click to browse</p>
        <input type="file" id="file-input" accept=".json" hidden>
      </div>
    </div>

    <!-- Add / Edit form -->
    <div class="form-card" id="form-card">
      <div class="form-title" id="form-title">ADD PLAYER</div>
      <form id="player-form" autocomplete="off">
        <input type="hidden" id="edit-index" value="-1">
        <div class="form-grid">
          <div class="field">
            <label for="f-username">Username</label>
            <input type="text" id="f-username" required placeholder="e.g. TechnoGod">
          </div>
          <div class="field">
            <label for="f-platform">Platform</label>
            <select id="f-platform">
              <option value="pc">PC (1.00x)</option>
              <option value="pojav_kbm">Pojav KBM (1.02x)</option>
              <option value="pojav_touch">Pojav Touch (1.08x)</option>
            </select>
          </div>
        </div>
        <div class="skills-grid" style="margin-top:0.8rem;">
          <div class="field"><label for="f-raw_pvp">Raw PvP</label><input type="number" id="f-raw_pvp" min="0" max="100" value="0"></div>
          <div class="field"><label for="f-building">Building</label><input type="number" id="f-building" min="0" max="100" value="0"></div>
          <div class="field"><label for="f-redstone">Redstone</label><input type="number" id="f-redstone" min="0" max="100" value="0"></div>
          <div class="field"><label for="f-ice_boat">Ice Boat</label><input type="number" id="f-ice_boat" min="0" max="100" value="0"></div>
          <div class="field"><label for="f-trap_box">Trap Box</label><input type="number" id="f-trap_box" min="0" max="100" value="0"></div>
          <div class="field"><label for="f-ffa_br">FFA BR</label><input type="number" id="f-ffa_br" min="0" max="100" value="0"></div>
        </div>
        <div class="form-grid" style="margin-top:0.8rem;">
          <div class="field">
            <label for="f-penance">Penance Score (optional)</label>
            <input type="number" id="f-penance" min="0" placeholder="Leave empty if none">
          </div>
          <div class="field">
            <label for="f-skin">Skin URL (optional)</label>
            <input type="url" id="f-skin" placeholder="Leave empty = auto from username">
          </div>
        </div>
        <div class="form-actions">
          <button type="submit" class="btn-grass" id="form-submit">ADD PLAYER</button>
          <button type="button" class="btn-ghost" id="form-cancel" style="display:none;">CANCEL EDIT</button>
        </div>
      </form>
    </div>

    <!-- Player table -->
    <div style="overflow-x:auto;">
      <table class="player-table" id="player-table">
        <thead>
          <tr>
            <th>#</th><th>Username</th><th>Platform</th>
            <th>PvP</th><th>Build</th><th>Redst</th>
            <th>Boat</th><th>Trap</th><th>BR</th>
            <th>Penance</th><th>Actions</th>
          </tr>
        </thead>
        <tbody id="table-body"></tbody>
      </table>
    </div>
    <p class="empty-msg" id="empty-msg" hidden>No players yet. Add one above.</p>
  </main>

  <script src="./admin.js"></script>
</body>
</html>
